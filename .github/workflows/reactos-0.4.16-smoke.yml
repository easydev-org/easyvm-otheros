name: reactos-0.4.16-smoke

# DOES THE REACTOS DISK REACH ITS DESKTOP? Boot it with no CD, read the desktop, record it.
#
# THIS GUEST'S INSTALL LEG EXISTS AND WORKS IN CI - `reactos-0.4.16-install.yml` runs all 28 steps of
# `reactos/steps/install.walk` and publishes the disk (run 45496609390) - SO THIS STAGE TESTS WHAT THAT
# LEG PRODUCED, with no CD attached.
#
# THE INSTALL LEG IS A HAND-WRITTEN JOB RATHER THAN A `stage.yml` CALLER, AND THE REASON IS AN ENGINE
# DEFECT RATHER THAN ANYTHING IN THIS REPOSITORY:
#
#   easydev-org/easyvm#9   A complete ReactOS 0.4.16 install is 415 MiB, and the engine refuses to
#                          publish any disk below 512 MiB. `min_mb` is DECLARED as a field of `stop:`
#                          and of `disk:` so a small artifact can say what small means, but nothing
#                          ever folds it into the `disk_min_mb` that `compress:` reads, so the floor
#                          is always 512 and cannot be lowered from a walkthrough. stage.yml carries a
#                          second copy of the same 512 MiB check with no override at all.
#
# So that job runs the walk and then pushes `work/disk.qcow2` itself with `scripts/publish-disk.py`,
# which has no floor, under the tag this file's `pull:` names. When #9 is fixed the job loses its push
# step and nothing here changes, because the tag is already `reactos-install`.
#
# THE DISK IS VERIFIED TWICE, WHICH IS WHY PUBLISHING IT BY HAND IS NOT A GUESS:
#
#	its filesystem, with `mdir -i disk.qcow2@@1M`: `freeldr.sys`, `rosload.exe`, `ReactOS/`,
#	`Program Files`, `Documents and Settings`, 164 MiB free;
#	its boot, by this very walk: 3 of 3 steps locally, with `Recycle Bin` read off the desktop.
#
# THE WITNESS IS `Recycle Bin` AND IT IS THE ONE THAT TELLS AN INSTALL FROM A LIVE CD. MEASURED:
# ReactOS's live CD and its installed system draw nearly the same desktop, so a gate on the wallpaper
# would pass on both. The live CD's desktop carries an `Install ReactOS` icon where the installed one
# carries the `Recycle Bin`, and the reading of the installed desktop yields
# `"Computer  My Network  Recycle Bin  Applications`.
#
# NO ISO AND NO CD. The only thing that can produce that desktop is the published disk.
#
# BIOS AND i440fx, LIKE THE INSTALL LEG: ReactOS 0.4.16 is i386 with no amd64 release and no UEFI
# loader, so there is no pflash and no OVMF, and the target is `-drive if=ide` because the release
# carries no virtio-blk driver. The frame is 800x600 because the guest draws 800x600; nothing here
# clicks, so the engine's 1920x1080 rule for `click:` never applies.
on:
  workflow_dispatch:
    inputs:
      from_tag:
        description: >-
          the PUBLISHED disk to boot. Defaults to the tag the install leg writes.
        default: "reactos-install"
      disks_repository:
        description: "the ghcr repository that holds the disk"
        default: "easydev-org/easyvm-otheros"

concurrency:
  group: reactos-0.4.16-smoke
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  checks: write

jobs:
  smoke:
    uses: easydev-org/easyvm/.github/workflows/stage.yml@v0.0.3-dev
    secrets: inherit
    with:
      image_repository: easydev-org/easyvm
      image_tag: v0.0.3-dev
      disk_gb: "20"
      group: reactos-0.4.16-smoke
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "reactos-smoke",
            "file": "reactos/steps/smoke.walk",
            "pull": "${{ inputs.from_tag }}",
            "out": "",
            "timeout": 20
          }
        ]