name: 9front-11952-smoke

# DOES 9FRONT REACH A WORKING SHELL? Boot the LiveCD, answer its two console prompts, and ask the
# shell a question only a running system can answer.
#
# 9FRONT IS A FORK OF PLAN 9 FROM BELL LABS - a distributed OS whose "desktop" is Rio, a window system
# where the screen is a filesystem. It publishes a LiveCD as `.iso.gz`; this repository unpacks it at
# publication time, because qemu cannot open a gzip stream and a walkthrough cannot run `gunzip`.
#
# THE KEYBOARD IS PS/2 AND THERE IS NO USB DEVICE AT ALL. THIS IS THE FINDING THAT COST THE FIRST
# ROUND. MEASURED with `-device piix3-usb-uhci` + `usb-kbd` + `usb-tablet`, the kernel printed
#
#	nusb/usbd: ... descr. too small
#	nusb/usbd: no hubs
#
# on every boot and NOT ONE KEYSTROKE reached the console - the walk sat on `bootargs` while the machine
# was plainly waiting for input. With no `usb-*` device at all, `pc`'s own i8042 controller takes the
# keyboard and both prompts answer. Plan 9's USB stack is young; the Hurd walk records the same thing.
#
# THE WITNESS IS A MARKER THE SHELL ECHOES, NOT A SCREEN STATE. The console's last lines are drawn at
# the bottom of an 80x25 text screen that this OCR reads only partially, so a gate on `monitor is` or
# `vesa` sees a truncated frame even when those rows are on screen - MEASURED:
#
#	error: none of "vesa" in "Ox0060e000 Ox1IcdbOOO 426561536 427139072 bytes free pcirouting: ..."
#
# So the loop does what a person would: type the command, press Return, look for it echoed. While the
# console is still a log the text is swallowed; once init hands over to `/bin/rc` the shell echoes it
# back. MEASURED on the pod: satisfied after 3 attempt(s), and the first attempt's reading was still
# the kernel's `aux/vga: controller not in /libsygadb` line.
#
# THE WALK ANSWERS THREE PROMPTS, SETS A 1920x1080 MODE, CLICKS THE TERMINAL, AND ASKS THE SHELL A
# QUESTION. Each of those is a measured finding, and the third is the one that took longest:
#
#	`vgasize` / `monitor` / `mouseport`   `cfg/plan9.ini` on the CD says `ask` for all three, and
#	                                       `screenrc` asks them the instant rc reaches that line. A
#	                                       marker typed "before" them was APPENDED to `vgasize`, and
#	                                       `aux/vga` then failed with
#	                                         vesa@echo not in vesa bios / bind: #i: no frame buffer
#	                                       - so they are answered first, in the order asked.
#
#	`1920x1080x16` AND NOT THE DEFAULT   rio(1): the keyboard follows the POINTER, moved by "clicking
#	                                       (pressing and releasing) mouse button 1 in a non-current
#	                                       window". The engine refuses `click:` on any frame that is not
#	                                       1920x1080, and 9front's own default is 1024x768, which
#	                                       therefore cannot be clicked at all. `vgasize` is a prompt, so
#	                                       the answer may be larger - MEASURED, the frame becomes
#	                                       1920x1080.
#
#	THE CLICK THEN WORKS                  MEASURED: with `usb-tablet` at 1920x1080 the cursor reaches
#	                                       the window and the press gives it the keyboard, and
#	                                       `term% echo nfok` comes back with `nfok` under it.
#
# BOTH GATES ARE PICTURES, AND BOTH SCORE 1.0000. The console font is 8px and this OCR reads it as
# fragments (`termz`, `nfok` once in five), so `mode: like` against `reference/desktop.png` (Rio up) and
# `reference/answered.png` (the marker's own output) is what makes the claim; the second is tightened to
# 0.98 because it must NOT match a frame where the command was swallowed.
#
# IT PUBLISHES NO DISK. `out:` is empty, so stage.yml reports "no disk to publish" and the artifact is
# the recording.
on:
  workflow_dispatch:
    inputs:
      disks_repository:
        description: "the ghcr repository that holds the media"
        default: "easydev-org/easyvm-otheros"

concurrency:
  group: 9front-11952-smoke
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  checks: write

jobs:
  smoke:
    uses: easydev-org/easyvm/.github/workflows/stage.yml@v0.0.3-dev
    secrets: inherit
    with:
      image_repository: easydev-org/easyvm
      image_tag: v0.0.3-dev
      disk_gb: "20"
      group: 9front-11952-smoke
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "ninefront-smoke",
            "file": "ninefront/steps/smoke.walk",
            "assets": ["iso-9front-11952:9front.iso.tar"],
            "pull": "",
            "out": "",
            "timeout": 25
          }
        ]