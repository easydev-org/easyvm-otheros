name: kolibrios-0.7.7.0-smoke

# DOES KOLIBRIOS REACH ITS DESKTOP FROM ITS OWN LIVECD? Boot it, compare the menu bar, record it.
#
# THIS GUEST HAS NO INSTALL LEG AND DOES NOT NEED ONE. KolibriOS publishes a LiveCD ISO that boots
# straight to a desktop in RAM - no partition table to prepare, no installer to drive, no login and no
# persistence. The claim worth publishing is that the medium boots on OUR machine and draws its
# desktop, and this stage is the whole of it.
#
# THE MEDIUM IS THE ISO, WHICH IS WHAT ITS DOWNLOAD PAGE RECOMMENDS, attached as a CD on `pc`'s primary
# IDE channel. The project also ships a `.raw` hybrid for UEFI and a `.img` for a floppy; neither is
# needed to answer the question this stage asks.
#
# THE WITNESS IS A PICTURE, AND THIS GUEST IS WHY `mode: like` IS IN THIS REPOSITORY AT ALL.
#
# MEASURED: tesseract reads almost nothing off this desktop. Its 8-pixel bitmap font comes back as
# fragments - `kena`, `TuNveAD`, `ROSAVE`, `PIPES.`, `eOuITE`, `FeeREAD` - which are every icon LABEL,
# mis-read. A `words:` gate here could only be tuned to whatever one tesseract version hallucinated,
# and would break on the next.
#
# So the gate compares sight: `mode: like` crops the same rectangle from the live frame and from
# `reference/desktop.png` and scores them. MEASURED on the pod: 1.0000 similar on the second attempt.
#
# THE RECTANGLE IS THE MENU BAR'S LEFT END - the green `Menu` button and the blue icon beside it. It
# never changes; the clock at the right end changes every minute and is deliberately outside it.
#
# THE REFERENCE IS A FULL 1024x768 FRAME, NOT A CROPPED BAR: `similarityInRect` crops the reference with
# the same `rect`, so a pre-cropped picture would be cut a second time and never match.
#
# IT PUBLISHES NO DISK. `out:` is empty, so stage.yml reports "no disk to publish" and the artifact is
# the recording. The ISO is read-only input.
on:
  workflow_dispatch:
    inputs:
      disks_repository:
        description: "the ghcr repository that holds the media"
        default: "easydev-org/easyvm-otheros"

concurrency:
  group: kolibrios-0.7.7.0-smoke
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  checks: write

jobs:
  smoke:
    uses: easydev-org/easyvm/.github/workflows/stage.yml@v0.0.4
    secrets: inherit
    with:
      image_repository: easydev-org/easyvm
      image_tag: v0.0.4
      disk_gb: "20"
      group: kolibrios-0.7.7.0-smoke
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "kolibrios-smoke",
            "file": "kolibri/steps/smoke.walk",
            "assets": ["iso-kolibrios-0.7.7.0:kolibrios.iso.tar"],
            "pull": "",
            "out": "",
            "timeout": 20
          }
        ]