name: zz-mini
'on':
  workflow_dispatch: null
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/easydev-org/easyvm:v0.0.3-dev
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    steps:
    - run: echo minimal
