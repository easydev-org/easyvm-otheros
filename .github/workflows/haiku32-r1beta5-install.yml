name: haiku32-r1beta5-install

# INSTALL 32-BIT HAIKU THROUGH ITS OWN INSTALLER AND PUBLISH THE DISK.
#
# THIS IS THE SAME PROCEDURE AS `haiku-r1beta5-install.yml` AGAINST THE OTHER MEDIUM, AND THE TWO IMAGES
# ARE THE SAME SIZE. MEASURED: `haiku-r1beta5-x86_64-anyboot.iso` and
# `haiku-r1beta5-x86_gcc2h-anyboot.iso` are both 1,477,246,976 bytes, with digests 22ae312a... and
# bd6d5015... respectively - the two values on haiku-os.org's own r1beta5 page. Same length, different
# bytes, so this row pins the digest and not the size.
#
# A 32-BIT GUEST IS ACCEPTED HERE. The architecture is not a reason to exclude a system, only a fact
# about the machine it needs, and `x86_gcc2h` is the build Haiku still ships for the 32-bit world
# (gcc 2.95 plus 13, for BeOS binary compatibility).
#
# THE WALK IS `haiku/steps/install.walk` WITH THE MEDIUM'S NAME CHANGED, AND THAT IS MEASURED RATHER
# THAN HOPED: the Installer and DriveSetup are the same applications in both builds, drawn at the same
# size by the same VESA mode, so MEASURED every coordinate lands as it does on the 64-bit image. The
# file `haiku32/steps/install.walk` carries that reasoning at its head.
#
# IT PUBLISHES `haiku32-install`, A DIFFERENT TAG FROM `haiku-install`, because it is a different
# disk - and the smoke leg pulls it by that name.
#
on:
  workflow_dispatch:
    inputs:
      disks_repository:
        description: "the ghcr repository that holds the media and receives the disk"
        default: "easydev-org/easyvm-otheros"

concurrency:
  group: haiku32-r1beta5-install
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  checks: write

jobs:
  install:
    uses: easydev-org/easyvm/.github/workflows/stage.yml@v0.0.3-dev
    secrets: inherit
    with:
      image_repository: easydev-org/easyvm
      image_tag: v0.0.3-dev
      disk_gb: "20"
      group: haiku32-r1beta5-install
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "haiku32-install",
            "file": "haiku32/steps/install.walk",
            "assets": ["iso-haiku-r1beta5-x86:haiku32.iso.tar"],
            "pull": "",
            "out": "out/haiku32.qcow2",
            "timeout": 45,
            "publish": "haiku32-install"
          }
        ]